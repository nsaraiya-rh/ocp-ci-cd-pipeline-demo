# API tier — stub node server (public image) that answers 200 on any path.
# DB_HOST uses the SHORT service name `mysql`, which resolves to the MySQL
# Service in whatever namespace this is deployed to (namespace-portable).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    tier: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: application
    spec:
      containers:
        - name: api
          image: docker.io/library/node:18-alpine   # public; stub server below
          command:
            - node
            - "-e"
            - "require('http').createServer((req,res)=>res.end('ok')).listen(3000,()=>console.log('stub api on 3000'))"
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "mysql"                          # short name → resolves in-namespace
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: database } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: password } }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
