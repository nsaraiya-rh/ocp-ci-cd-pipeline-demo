# Frontend tier — nginx serving a ConfigMap-driven page.
# Namespace-agnostic: no `namespace:` field (ArgoCD applies to the destination
# namespace), and the Route has no `host:` so OpenShift generates a unique one
# per namespace. The page text lives in the ConfigMap — that's what lab users
# edit to see "their" change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-content
  labels:
    app: frontend
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>Three-Tier Lab</title></head>
      <body style="font-family: sans-serif; margin: 3rem;">
        <h1>Three-Tier Lab &mdash; edit me!</h1>
        <p>Change this text in <code>gitops/base/frontend.yaml</code> on your
           branch, push, and watch it appear in your dev environment.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    tier: presentation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      containers:
        - name: frontend
          image: docker.io/nginxinc/nginx-unprivileged:1.25-alpine   # public; listens on 8080
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: content
          configMap:
            name: frontend-content
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  to:
    kind: Service
    name: frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
