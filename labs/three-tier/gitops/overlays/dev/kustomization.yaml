apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay — lighter footprint (each of the 6 users runs their own copy in
# their own namespace).
resources:
  - ../../base

replicas:
  - name: frontend
    count: 1
  - name: api
    count: 1

# Built frontend image. `newName` must match ${JFROG_URL}/${JFROG_REPO} in CI;
# `newTag` is bumped by the deploy-dev CI job on each push (starts at "initial").
images:
  - name: frontend-image
    newName: globe.jfrog.io/ntg-capdv-docker-local/three-tier-frontend
    newTag: "initial"
