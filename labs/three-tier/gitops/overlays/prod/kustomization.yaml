apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod overlay — full replica counts from base (frontend 3, api 2). Deployed to
# the shared `three-tier-prod` namespace when an MR is merged to main.
resources:
  - ../../base

# Built frontend image. `newTag` is set by the promote-prod CI job (copies the
# tested dev tag on merge to main) — starts at "initial".
images:
  - name: frontend-image
    newName: globe.jfrog.io/ntg-capdv-docker-local/three-tier-frontend
    newTag: "initial"
