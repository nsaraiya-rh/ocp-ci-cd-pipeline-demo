# AppProject for the three-tier lab. Covers every user dev namespace
# (three-tier-userN) and the shared prod namespace (three-tier-prod) via one
# wildcard destination.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: three-tier-lab
  namespace: openshift-gitops
spec:
  description: Three-tier hands-on lab — per-user dev namespaces + shared prod.
  sourceRepos:
    - 'https://gitlab.com/globetelecom/platforms/ntg-redhat-capability-development-program/Applications/three-tier-lab.git'
  destinations:
    - server: https://kubernetes.default.svc
      namespace: 'three-tier-*'
  clusterResourceWhitelist: []          # app is fully namespaced
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
