# Shared PROD environment. Tracks main and deploys the prod overlay into the
# single three-tier-prod namespace. When a user's MR is merged to main, this
# auto-syncs — that is the "MR to prod" half of the lab.
#
# Namespace three-tier-prod must exist, labelled
# argocd.argoproj.io/managed-by=openshift-gitops, with a mysql-credentials Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: three-tier-prod
  namespace: openshift-gitops
spec:
  project: three-tier-lab
  source:
    repoURL: "https://gitlab.com/globetelecom/platforms/ntg-redhat-capability-development-program/Applications/three-tier-lab.git"
    targetRevision: main
    path: gitops/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: three-tier-prod
  # The api HPA owns spec/replicas — ignore it so prod doesn't sit OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
