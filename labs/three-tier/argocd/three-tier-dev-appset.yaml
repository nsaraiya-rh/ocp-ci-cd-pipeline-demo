# Per-user DEV environments. A list generator creates one Application per lab
# user; each tracks that user's long-lived branch (lab/userN) and deploys the
# dev overlay into that user's own namespace (three-tier-userN).
#
# Push to your branch  ->  your dev namespace updates. That is the dev half of
# the lab. Merging your branch to main is what promotes to shared prod.
#
# Replace __LAB_REPO_URL__. The namespaces three-tier-userN must already exist,
# labelled argocd.argoproj.io/managed-by=openshift-gitops, each with a
# mysql-credentials Secret (see the lab guide's instructor setup).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: three-tier-dev
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - { user: user1 }
          - { user: user2 }
          - { user: user3 }
          - { user: user4 }
          - { user: user5 }
          - { user: user6 }
  template:
    metadata:
      name: "three-tier-dev-{{.user}}"
    spec:
      project: three-tier
      source:
        repoURL: "__LAB_REPO_URL__"
        targetRevision: "lab/{{.user}}"          # each user's long-lived branch
        path: gitops/overlays/dev
      destination:
        server: https://kubernetes.default.svc
        namespace: "three-tier-{{.user}}"        # each user's own namespace
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false                # namespaces pre-created + labelled
