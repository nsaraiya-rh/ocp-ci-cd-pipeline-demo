# CI/CD pipeline — any branch deploys to dev; merge to main promotes to prod.
#
#   On a commit to ANY branch except `main` (app/ changed):
#     build-image  -> buildah builds app/, pushes to JFrog tagged <commit sha>
#     deploy-dev   -> writes that tag into gitops/overlays/dev on the `dev`
#                     branch (ArgoCD tracks `dev`), so the dev environment shows
#                     whatever branch you last pushed. Create branches with any
#                     name — no naming restriction.
#
#   On merge of an MR into `main`:
#     promote-prod -> copies the CURRENT dev image tag into gitops/overlays/prod
#                     on main. ArgoCD (tracking `main`) then shows prod OutOfSync;
#                     a human clicks Sync. Promotes the exact image dev ran — no
#                     rebuild.
#
#   NB: `dev` is a shared "latest push wins" environment. Prod promotes whatever
#   is currently deployed to dev.
#
#   This is the SHARED-DEV model used by the demo install.sh. For per-branch
#   PREVIEW environments (real GitLab), use .gitlab-ci.preview.yml instead — it
#   drops deploy-dev and promotes the tested image via the merge commit's 2nd
#   parent. See docs/preview-environments.md.
#
# CI/CD variables (Settings > CI/CD > Variables — set by install.sh):
#   JFROG_URL / JFROG_REPO / JFROG_USER / JFROG_TOKEN
# Push-back to the gitops overlays uses the built-in CI_JOB_TOKEN.

stages:
  - build
  - deploy-dev
  - promote-prod

variables:
  # In-cluster GitLab uses a self-signed router cert; git clone/fetch need this.
  GIT_SSL_NO_VERIFY: "true"
  IMAGE: "${JFROG_URL}/${JFROG_REPO}/sample-app"

workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/'   # our own gitops commits
      when: never
    - if: '$CI_COMMIT_BRANCH'                      # any branch

build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]          # required so GitLab can inject its shell
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'           # any branch except main
      changes: [ 'app/**', '.gitlab-ci.yml' ]
  script:
    - 'echo "Building ${IMAGE}:${CI_COMMIT_SHORT_SHA} from branch ${CI_COMMIT_REF_NAME}"'
    - 'AUTH=$(printf "%s:%s" "${JFROG_USER}" "${JFROG_TOKEN}" | base64 | tr -d "\n")'
    - 'mkdir -p /kaniko/.docker'
    - 'printf "{\"auths\":{\"%s\":{\"auth\":\"%s\"}}}" "${JFROG_URL}" "${AUTH}" > /kaniko/.docker/config.json'
    - '/kaniko/executor --context "${CI_PROJECT_DIR}/app" --dockerfile "${CI_PROJECT_DIR}/app/Dockerfile" --destination "${IMAGE}:${CI_COMMIT_SHORT_SHA}" --build-arg APP_VERSION="${CI_COMMIT_SHORT_SHA}"'

deploy-dev:
  stage: deploy-dev
  image: registry.access.redhat.com/ubi9/ubi:latest
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'           # any branch except main
      changes: [ 'app/**', '.gitlab-ci.yml' ]
  script:
    - 'dnf install -y git >/dev/null'
    # Update the dev overlay on the fixed `dev` branch (ArgoCD tracks it),
    # regardless of which branch triggered the build.
    - 'git clone --depth 1 -b dev "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" _gitops'
    - 'cd _gitops'
    - 'sed -i -E "s|(newTag:)[[:space:]]*\"[^\"]*\"|\1 \"${CI_COMMIT_SHORT_SHA}\"|" gitops/overlays/dev/kustomization.yaml'
    - 'git config user.email "ci@gitlab.demo"'
    - 'git config user.name "GitLab CI"'
    - 'git add gitops/overlays/dev/kustomization.yaml'
    - 'git diff --cached --quiet && echo "dev already at ${CI_COMMIT_SHORT_SHA}" && exit 0 || true'
    - 'git commit -m "dev: deploy ${CI_COMMIT_SHORT_SHA} (from ${CI_COMMIT_REF_NAME}) [skip ci]"'
    - 'git push origin HEAD:dev'

promote-prod:
  stage: promote-prod
  image: registry.access.redhat.com/ubi9/ubi:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - 'dnf install -y git >/dev/null'
    # Promote whatever is currently deployed to dev (read the tag from the dev branch).
    - 'git fetch --depth 1 origin dev'
    - 'DEV_TAG=$(git show origin/dev:gitops/overlays/dev/kustomization.yaml | grep -E "^[[:space:]]*newTag:" | tail -1 | awk "{print \$2}" | tr -d "\"")'
    - 'echo "Promoting current dev tag to prod: ${DEV_TAG}"'
    - 'test -n "${DEV_TAG}"'
    - 'sed -i -E "s|(newTag:)[[:space:]]*\"[^\"]*\"|\1 \"${DEV_TAG}\"|" gitops/overlays/prod/kustomization.yaml'
    - 'git config user.email "ci@gitlab.demo"'
    - 'git config user.name "GitLab CI"'
    - 'git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"'
    - 'git add gitops/overlays/prod/kustomization.yaml'
    - 'git diff --cached --quiet && echo "prod already at ${DEV_TAG}" && exit 0 || true'
    - 'git commit -m "prod: promote ${DEV_TAG} [skip ci]"'
    - 'git push origin HEAD:main'
