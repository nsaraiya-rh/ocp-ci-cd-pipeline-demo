# CI/CD pipeline for sample-app (MONOREPO — app source + gitops in same project).
#
#   build-image      -> buildah builds app/ and pushes to JFrog Artifactory,
#                       tagged with the git commit short SHA.
#   update-manifest  -> bumps gitops/overlays/dev/kustomization.yaml newTag and
#                       pushes the commit back to THIS repo (main). ArgoCD then
#                       auto-syncs sample-app-dev.
#
# Promotion to prod = a separate MR in THIS repo that changes
# gitops/overlays/prod/kustomization.yaml newTag. NOT automated here.
#
# CI/CD variables required (Settings > CI/CD > Variables — set by install.sh):
#   JFROG_URL   e.g. company.jfrog.io      (host only, no protocol)
#   JFROG_REPO  e.g. docker-local          (Docker repo name in Artifactory)
#   JFROG_USER  JFrog identity
#   JFROG_TOKEN JFrog access token (masked)
#
# Push-back to the gitops overlay uses CI_JOB_TOKEN — no long-lived credential
# to rotate. Requires "CI_JOB_TOKEN allowed to push" (default true on new
# projects in GitLab 16+; install.sh sets it explicitly).

stages:
  - build
  - update-manifest

variables:
  # In-cluster GitLab uses a self-signed router cert; the built-in get_sources
  # step (git clone) needs this to succeed. Remove in customer envs with real TLS.
  GIT_SSL_NO_VERIFY: "true"
  IMAGE: "${JFROG_URL}/${JFROG_REPO}/sample-app"

workflow:
  rules:
    # Only build on main, only when app code (or the pipeline file) changes,
    # skip commits marked [skip ci] — the update-manifest commit itself is
    # marked [skip ci] AND only touches gitops/, so it cannot re-trigger.
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/'
      changes: [ 'app/**', '.gitlab-ci.yml' ]

build-image:
  stage: build
  image: quay.io/buildah/stable:latest
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
  script:
    - 'cd app'
    - 'echo "Building ${IMAGE}:${CI_COMMIT_SHORT_SHA}"'
    - 'buildah bud --build-arg APP_VERSION="${CI_COMMIT_SHORT_SHA}" -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" -f Dockerfile .'
    - 'buildah login -u "${JFROG_USER}" -p "${JFROG_TOKEN}" "${JFROG_URL}"'
    - 'buildah push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"'

update-manifest:
  stage: update-manifest
  image: registry.access.redhat.com/ubi9/ubi:latest
  script:
    - 'dnf install -y git >/dev/null'
    - 'sed -i -E "s|(newTag:)[[:space:]]*\"[^\"]*\"|\1 \"${CI_COMMIT_SHORT_SHA}\"|" gitops/overlays/dev/kustomization.yaml'
    - 'git config user.email "ci@gitlab.demo"'
    - 'git config user.name "GitLab CI"'
    - 'git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"'
    - 'git add gitops/overlays/dev/kustomization.yaml'
    - 'git diff --cached --quiet && echo "no change" && exit 0 || true'
    - 'git commit -m "dev: bump sample-app to ${CI_COMMIT_SHORT_SHA} [skip ci]"'
    - 'git push origin HEAD:main'
