<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img"
     aria-labelledby="diagram-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="diagram-title">GitOps CI/CD architecture — GitHub triggers GitLab CI, which builds and pushes to the OpenShift internal registry and updates the gitops manifest, then ArgoCD deploys.</title>

  <defs>
    <marker id="arrow-ci" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B96A1F"/>
    </marker>
    <marker id="arrow-cd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F7E"/>
    </marker>
    <marker id="arrow-git" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24303C"/>
    </marker>
    <style>
      .title      { fill:#131A24; font-size:15px; font-weight:600; }
      .sub        { fill:#5C6875; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11px; }
      .arrow-label{ fill:#131A24; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11px; }
      .arrow-sub  { fill:#5C6875; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:10px; }
      .cluster-lbl{ fill:#5C6875; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1100" height="560" fill="#FFFFFF"/>

  <!-- OpenShift cluster boundary -->
  <rect x="30" y="200" width="1040" height="340" rx="8" fill="#EEF1F4" stroke="#CBD3DB" stroke-dasharray="6 4"/>
  <text x="50" y="228" class="cluster-lbl">OpenShift cluster</text>

  <!-- Developer -->
  <g>
    <circle cx="90" cy="80" r="22" fill="#FFFFFF" stroke="#24303C" stroke-width="1.5"/>
    <text x="90" y="86" text-anchor="middle" class="title" font-size="16">👤</text>
    <text x="90" y="128" text-anchor="middle" class="title">Developer</text>
    <text x="90" y="146" text-anchor="middle" class="sub">edits app.py</text>
  </g>

  <!-- GitHub -->
  <g>
    <rect x="220" y="55" width="220" height="100" rx="6" fill="#FFFFFF" stroke="#24303C" stroke-width="1.5"/>
    <text x="330" y="82" text-anchor="middle" class="title">GitHub</text>
    <text x="330" y="102" text-anchor="middle" class="sub">source of truth</text>
    <text x="330" y="122" text-anchor="middle" class="sub">sample-app/  ·  gitops/</text>
    <text x="330" y="140" text-anchor="middle" class="sub">.github/workflows/</text>
  </g>

  <!-- 1. commit -->
  <line x1="115" y1="80" x2="215" y2="80" stroke="#24303C" stroke-width="1.5" marker-end="url(#arrow-git)"/>
  <text x="165" y="70" text-anchor="middle" class="arrow-label">1 · push</text>

  <!-- GitHub Action -->
  <g>
    <rect x="510" y="55" width="220" height="100" rx="6" fill="#FFFFFF" stroke="#24303C" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="620" y="82" text-anchor="middle" class="title">GitHub Action</text>
    <text x="620" y="102" text-anchor="middle" class="sub">mirror-to-gitlab.yml</text>
    <text x="620" y="122" text-anchor="middle" class="sub">on push to sample-app/**</text>
    <text x="620" y="140" text-anchor="middle" class="sub">git push → GitLab</text>
  </g>

  <!-- 2. mirror -->
  <line x1="445" y1="105" x2="505" y2="105" stroke="#B96A1F" stroke-width="1.5" marker-end="url(#arrow-ci)"/>
  <text x="475" y="95" text-anchor="middle" class="arrow-label">2</text>

  <!-- GitLab -->
  <g>
    <rect x="80" y="270" width="230" height="115" rx="6" fill="#FFFFFF" stroke="#B96A1F" stroke-width="1.5"/>
    <text x="195" y="298" text-anchor="middle" class="title">GitLab</text>
    <text x="195" y="316" text-anchor="middle" class="sub">gitlab-system namespace</text>
    <text x="195" y="338" text-anchor="middle" class="sub">webservice · gitaly · db</text>
    <text x="195" y="356" text-anchor="middle" class="sub">.gitlab-ci.yml runs</text>
    <text x="195" y="374" text-anchor="middle" class="sub">2 stages</text>
  </g>

  <!-- GitLab Runner -->
  <g>
    <rect x="80" y="415" width="230" height="95" rx="6" fill="#FFFFFF" stroke="#B96A1F" stroke-width="1.5"/>
    <text x="195" y="442" text-anchor="middle" class="title">GitLab Runner</text>
    <text x="195" y="460" text-anchor="middle" class="sub">gitlab-runner namespace</text>
    <text x="195" y="480" text-anchor="middle" class="sub">kubernetes executor</text>
    <text x="195" y="498" text-anchor="middle" class="sub">buildah pod per job</text>
  </g>

  <!-- Runner ↔ GitLab poll -->
  <path d="M 195 415 L 195 385" stroke="#8592A0" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <text x="215" y="405" class="arrow-sub">polls every 3s</text>

  <!-- Internal Registry -->
  <g>
    <rect x="410" y="270" width="230" height="115" rx="6" fill="#FFFFFF" stroke="#B96A1F" stroke-width="1.5"/>
    <text x="525" y="298" text-anchor="middle" class="title">Internal registry</text>
    <text x="525" y="316" text-anchor="middle" class="sub">openshift-image-registry</text>
    <text x="525" y="338" text-anchor="middle" class="sub">sample-app/sample-app</text>
    <text x="525" y="356" text-anchor="middle" class="sub">tag = commit SHA</text>
    <text x="525" y="374" text-anchor="middle" class="sub">S3 backing store</text>
  </g>

  <!-- ArgoCD -->
  <g>
    <rect x="740" y="270" width="230" height="115" rx="6" fill="#FFFFFF" stroke="#1F6F7E" stroke-width="1.5"/>
    <text x="855" y="298" text-anchor="middle" class="title">ArgoCD</text>
    <text x="855" y="316" text-anchor="middle" class="sub">openshift-gitops namespace</text>
    <text x="855" y="338" text-anchor="middle" class="sub">watches gitops/</text>
    <text x="855" y="356" text-anchor="middle" class="sub">automated · self-heal · prune</text>
    <text x="855" y="374" text-anchor="middle" class="sub">webhook → instant sync</text>
  </g>

  <!-- Sample app workloads -->
  <g>
    <rect x="740" y="415" width="230" height="95" rx="6" fill="#FFFFFF" stroke="#1F6F7E" stroke-width="1.5"/>
    <text x="855" y="442" text-anchor="middle" class="title">Sample app</text>
    <text x="855" y="460" text-anchor="middle" class="sub">sample-app namespace</text>
    <text x="855" y="480" text-anchor="middle" class="sub">Deployment · Service · Route</text>
    <text x="855" y="498" text-anchor="middle" class="sub">rolling update</text>
  </g>

  <!-- 3. GitHub Action → GitLab -->
  <path d="M 620 155 Q 620 220 195 270" stroke="#B96A1F" stroke-width="1.8" fill="none" marker-end="url(#arrow-ci)"/>
  <text x="430" y="200" class="arrow-label">3 · trigger pipeline</text>

  <!-- 4. GitLab → registry -->
  <line x1="310" y1="327" x2="405" y2="327" stroke="#B96A1F" stroke-width="1.8" marker-end="url(#arrow-ci)"/>
  <text x="357" y="317" text-anchor="middle" class="arrow-label">4 · build + push</text>
  <text x="357" y="345" text-anchor="middle" class="arrow-sub">buildah</text>

  <!-- 5. GitLab → GitHub gitops commit -->
  <path d="M 195 270 Q 195 175 440 155" stroke="#24303C" stroke-width="1.8" fill="none" marker-end="url(#arrow-git)" stroke-dasharray="5 3"/>
  <text x="220" y="240" class="arrow-label">5 · commit new tag</text>
  <text x="220" y="256" class="arrow-sub">gitops/kustomization.yaml</text>

  <!-- 6. Webhook → ArgoCD (Manhattan routing over the top of GitHub Action box) -->
  <path d="M 440 55 L 440 32 Q 440 25 447 25 L 848 25 Q 855 25 855 32 L 855 265"
        stroke="#1F6F7E" stroke-width="1.8" fill="none" marker-end="url(#arrow-cd)"/>
  <text x="647" y="17" text-anchor="middle" class="arrow-label">6 · webhook (~2s)</text>

  <!-- 7. ArgoCD → registry (pull) -->
  <line x1="740" y1="327" x2="645" y2="327" stroke="#1F6F7E" stroke-width="1.8" marker-end="url(#arrow-cd)"/>
  <text x="692" y="317" text-anchor="middle" class="arrow-label">7 · pull image</text>

  <!-- 8. ArgoCD → workload -->
  <line x1="855" y1="385" x2="855" y2="410" stroke="#1F6F7E" stroke-width="1.8" marker-end="url(#arrow-cd)"/>
  <text x="870" y="402" class="arrow-label">8 · sync</text>

  <!-- End users -->
  <g>
    <circle cx="1030" cy="462" r="18" fill="#FFFFFF" stroke="#1F6F7E" stroke-width="1.5"/>
    <text x="1030" y="468" text-anchor="middle" class="title" font-size="14">🌐</text>
    <text x="1030" y="502" text-anchor="middle" class="sub">users</text>
  </g>
  <line x1="970" y1="462" x2="1012" y2="462" stroke="#1F6F7E" stroke-width="1.5" marker-end="url(#arrow-cd)"/>
</svg>
