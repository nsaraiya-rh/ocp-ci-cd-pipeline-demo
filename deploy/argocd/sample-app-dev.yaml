---
# ArgoCD Application: dev environment (environment-branch model).
# Tracks the `dev` BRANCH. The pipeline bumps gitops/overlays/dev on that
# branch on every app commit to dev, and ArgoCD auto-syncs it here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-dev
  namespace: openshift-gitops
spec:
  project: default
  source:
    # Substituted by install.sh with the actual GitLab host.
    repoURL: https://__GITLAB_HOST__/root/sample-app.git
    targetRevision: dev
    path: gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
