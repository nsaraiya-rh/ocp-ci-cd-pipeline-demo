---
# ArgoCD Application: dev environment (monorepo).
# Auto-syncs from the sample-app project's gitops/overlays/dev path.
# CI in the same project bumps the image tag here on every merge to main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-dev
  namespace: openshift-gitops
spec:
  project: default
  source:
    # Substituted by install.sh with the actual GitLab host.
    repoURL: https://__GITLAB_HOST__/root/sample-app.git
    targetRevision: main
    path: gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
