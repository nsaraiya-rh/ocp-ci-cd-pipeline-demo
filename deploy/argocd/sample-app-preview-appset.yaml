# Preview environments — one per BRANCH (push-triggered), all in the SHARED
# `sample-app-dev` namespace (feature-wise, not namespace-wise).
#
# How it works:
#   - The GitLab SCM Provider generator lists branches in the project that match
#     `branchMatch` and creates one Application per branch
#     ("sample-app-<branch-slug>"). No merge request required — a preview appears
#     as soon as you push a matching branch.
#   - Each Application deploys gitops/base into `sample-app-dev` with a per-branch
#     nameSuffix, a per-branch selector label, and the exact image built for the
#     branch's head commit ({{.sha}}). Unique names => no collisions; unique
#     selector label => Services target only their own pods; OpenShift
#     auto-generates a unique Route host per name.
#   - When the branch is DELETED, the generator drops the Application and prune
#     removes ONLY that branch's resources. (So delete the source branch on
#     merge — or enable "Delete source branch" — to tear previews down.)
#
# Prereqs (see docs/preview-environments.md):
#   - `sample-app-dev` already has the managed-by label + jfrog-pull secret
#     (one namespace => provision once; nothing per-branch).
#   - A read-only GitLab token in secret `gitlab-scm-token` (openshift-gitops)
#     so ArgoCD can list branches via the API.
#   - CI pushes the image tagged with the FULL commit SHA (see the doc).
#
# Replace the two __PLACEHOLDER__ values before applying.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-app-preview
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - scmProvider:
        gitlab:
          # Full (nested) group path that CONTAINS the project.
          group: "globetelecom/platforms/ntg-redhat-capability-development-program/Applications"
          api: "https://gitlab.com"
          allBranches: true              # generate for every branch, not just default
          includeSubgroups: false
          tokenRef:
            secretName: gitlab-scm-token
            key: token
        # Only these branches get a preview. This MUST NOT match `main`
        # (main is prod). RE2 has no negative lookahead, so use a prefix
        # convention instead of "everything except main".
        filters:
          - repositoryMatch: "^capdv-cluster-config$"
            branchMatch: "^(feature|feat|fix|hotfix|bugfix|chore)[/-].*"
        requeueAfterSeconds: 120         # re-poll branches (a webhook makes it instant)

  template:
    metadata:
      # DNS-safe, lowercased, hyphenated form of the branch name.
      name: "sample-app-{{.branchNormalized}}"
      labels:
        preview.capdv/branch: "{{.branchNormalized}}"
    spec:
      project: sample-app                # same AppProject as prod (carries the sync window)
      source:
        repoURL: "https://gitlab.com/globetelecom/platforms/ntg-redhat-capability-development-program/Applications/capdv-cluster-config.git"
        targetRevision: "{{.branch}}"    # the branch itself (raw name)
        path: gitops/base
        kustomize:
          # Unique object names per branch: sample-app-<slug>, svc/..., route/...
          # NOTE: keep branch names short — the auto-generated Route host is
          # "sample-app-<slug>-sample-app-dev" and each DNS label must be <=63
          # chars, so <slug> should stay under ~37 chars.
          nameSuffix: "-{{.branchNormalized}}"
          # Flows into Deployment + Service selectors so each branch's Service
          # targets only its own pods (prevents cross-wiring in one namespace).
          commonLabels:
            preview.capdv/branch: "{{.branchNormalized}}"
          # Deploy the exact image built for this branch's head commit.
          images:
            - "sample-app-image=globe.jfrog.io/ntg-capdv-docker-local/sample-app:{{.sha}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: sample-app-dev        # SHARED namespace for all previews
      syncPolicy:
        automated:
          prune: true                    # remove this branch's resources on delete
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
