---
# ArgoCD Application: prod environment (monorepo).
# Auto-synced, but GATED by the sync window on the `sample-app` AppProject
# (deploy/argocd/sample-app-project.yaml): a reviewed MR promotes the tested
# image into gitops/overlays/prod, and ArgoCD deploys it AUTOMATICALLY at the
# next allowed window. Outside the window it queues (OutOfSync). manualSync in
# the window lets an operator force an emergency deploy.
#
# Prefer a hard human gate instead of a schedule? Remove the `automated:` block
# below and sync manually (and you can drop the sync window).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-prod
  namespace: openshift-gitops
spec:
  project: sample-app
  source:
    repoURL: https://gitlab.com/globetelecom/platforms/ntg-redhat-capability-development-program/Applications/capdv-cluster-config.git
    targetRevision: main
    path: gitops/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app-prod
  syncPolicy:
    # Auto-sync — but only fires inside the AppProject's prod sync window.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
