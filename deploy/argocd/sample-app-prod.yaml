---
# ArgoCD Application: prod environment (monorepo).
# NOT auto-synced. Promotion is a reviewed MR in the same sample-app project
# that changes gitops/overlays/prod/kustomization.yaml newTag. Once merged,
# a human syncs this Application from the ArgoCD UI (or CLI).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-prod
  namespace: openshift-gitops
spec:
  project: default
  source:
    # Substituted by install.sh with the actual GitLab host.
    repoURL: https://__GITLAB_HOST__/root/sample-app.git
    targetRevision: main
    path: gitops/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app-prod
  syncPolicy:
    # No `automated:` block on purpose — sync only when a human triggers it.
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
